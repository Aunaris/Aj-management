<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2D animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --line: #e3e8ef;
  --text: #1c2533;
  --muted: #667085;
  --primary: #0f766e;
  --primary-2: #115e59;
  --primary-soft: #e6f4f1;
  --side: #10242c;
  --side-2: #183640;
  --side-text: #c7cfe2;
  --ok: #0f9d6b;
  --ok-soft: #e6f6ef;
  --warn: #b7791f;
  --warn-soft: #fdf3e1;
  --bad: #d63c3c;
  --bad-soft: #fdecec;
  --info: #2563eb;
  --info-soft: #e8f0fe;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  --shadow-lg: 0 20px 50px rgba(16, 24, 40, .25);
  --side-w: 252px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: 'Sarabun', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; color: var(--text); background: var(--bg); line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); }
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; line-height: 1.3; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.nowrap { white-space: nowrap; }
.right { text-align: right; }

/* ---------- Loading bar / overlay ---------- */
.topbar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 200; overflow: hidden; opacity: 0; transition: opacity .2s; pointer-events: none; }
.topbar.active { opacity: 1; }
.topbar::after { content: ''; position: absolute; top: 0; left: -40%; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, var(--primary), transparent); animation: bar 1s linear infinite; }
@keyframes bar { to { left: 100%; } }
.overlay { position: fixed; inset: 0; background: rgba(255, 255, 255, .7); display: grid; place-items: center; z-index: 180; backdrop-filter: blur(2px); }
.overlay-box { text-align: center; color: var(--muted); }
.spinner { width: 38px; height: 38px; border: 3px solid var(--primary-soft); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto .6rem; }
.btn .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: .35rem; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Skeleton ---------- */
.sk { background: linear-gradient(90deg, #e9edf3 25%, #f4f6f9 50%, #e9edf3 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 8px; }
@keyframes shimmer { to { background-position: -200% 0; } }
.sk-line { height: 14px; margin: .55rem 0; }
.sk-card { height: 96px; }
.sk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem; }

/* ---------- Login ---------- */
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: radial-gradient(circle at 20% 20%, #155e75, #10242c 60%); }
.login-card { width: min(420px, 100%); background: var(--surface); border-radius: 18px; padding: 2.2rem 2rem; box-shadow: var(--shadow-lg); }
.brand-mark { width: 46px; height: 46px; border-radius: 12px; background: linear-gradient(135deg, #14b8a6, #0f766e); color: #fff; display: grid; place-items: center; font-weight: 700; letter-spacing: -.5px; flex: none; }
.login-card .brand-mark { margin-bottom: 1rem; width: 54px; height: 54px; font-size: 1.15rem; }
.login-card h1 { font-size: 1.5rem; }
.login-card p { margin: .3rem 0 1.4rem; }

/* ---------- App shell ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar { position: fixed; top: 0; bottom: 0; left: 0; width: var(--side-w); background: var(--side); color: var(--side-text); display: flex; flex-direction: column; z-index: 120; transition: transform .25s, width .25s; }
.side-brand { display: flex; align-items: center; gap: .7rem; padding: 1.1rem 1.1rem 1rem; border-bottom: 1px solid rgba(255, 255, 255, .06); }
.side-brand strong { color: #fff; font-size: 1.05rem; display: block; }
.side-brand small { color: #8f9bb8; display: block; font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.nav { flex: 1; overflow-y: auto; padding: .7rem .6rem; }
.nav-group { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: #69769a; padding: .9rem .7rem .3rem; }
.nav button { display: flex; align-items: center; gap: .75rem; width: 100%; padding: .62rem .75rem; border: 0; background: transparent; color: var(--side-text); border-radius: 9px; cursor: pointer; text-align: left; font-size: .95rem; }
.nav button:hover { background: var(--side-2); color: #fff; }
.nav button.active { background: var(--primary); color: #fff; }
.nav .ico { width: 22px; text-align: center; font-size: 1.05rem; flex: none; }
.side-user { padding: .9rem 1rem; border-top: 1px solid rgba(255, 255, 255, .06); font-size: .85rem; }
.side-user strong { color: #fff; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 110; }
.main { flex: 1; margin-left: var(--side-w); min-width: 0; display: flex; flex-direction: column; transition: margin .25s; }
.header { position: sticky; top: 0; z-index: 90; display: flex; align-items: center; gap: .8rem; padding: .8rem 1.4rem; background: rgba(243, 245, 249, .92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.header h1 { font-size: 1.2rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header .org { font-size: .82rem; color: var(--muted); display: block; font-weight: 400; }
.menu-btn { display: none; border: 0; background: var(--surface); width: 40px; height: 40px; border-radius: 10px; box-shadow: var(--shadow); cursor: pointer; font-size: 1.2rem; }
.header-actions { display: flex; align-items: center; gap: .5rem; }
.chip-user { display: flex; flex-direction: column; text-align: right; font-size: .82rem; line-height: 1.25; max-width: 190px; min-width: 0; }
.chip-user strong, .chip-user span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip-user strong { font-size: .9rem; }
.content { padding: 1.4rem; max-width: 1440px; width: 100%; }

/* ---------- Components ---------- */
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.15rem 1.25rem; margin-bottom: 1rem; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: .8rem; margin-bottom: .9rem; flex-wrap: wrap; }
.card-head h2 { font-size: 1.05rem; }
.grid { display: grid; gap: 1rem; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
.stat { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1rem 1.15rem; position: relative; overflow: hidden; }
.stat .label { color: var(--muted); font-size: .85rem; }
.stat .value { font-size: 1.55rem; font-weight: 700; margin-top: .15rem; word-break: break-word; }
.stat .sub { font-size: .8rem; color: var(--muted); }
.stat.accent { background: linear-gradient(135deg, #0f766e, #155e75); color: #fff; }
.stat.accent .label, .stat.accent .sub { color: rgba(255, 255, 255, .8); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .35rem; border: 1px solid transparent; background: var(--surface-2); color: var(--text); padding: .5rem .95rem; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: .9rem; white-space: nowrap; text-decoration: none; transition: background .15s, border-color .15s; }
.btn:hover { border-color: var(--line); }
.btn.primary { background: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-2); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.success { background: var(--ok-soft); color: var(--ok); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.sm { padding: .3rem .6rem; font-size: .82rem; border-radius: 7px; }
.btn.block { width: 100%; padding: .7rem; }
.btn:disabled { opacity: .6; cursor: not-allowed; }
.btn-row { display: flex; gap: .4rem; flex-wrap: wrap; }
.toolbar { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
.toolbar .grow { flex: 1; min-width: 180px; }
.badge { display: inline-block; padding: .12rem .55rem; border-radius: 99px; font-size: .78rem; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.info { background: var(--info-soft); color: var(--info); }
.badge.primary { background: var(--primary-soft); color: var(--primary); }
.bar { height: 8px; background: #eaeef5; border-radius: 99px; overflow: hidden; min-width: 80px; }
.bar span { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
.bar.ok span { background: var(--ok); }
.bar.warn span { background: var(--warn); }
.bar.bad span { background: var(--bad); }
.bar-label { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-bottom: .2rem; gap: .5rem; }
.empty { text-align: center; padding: 2.2rem 1rem; color: var(--muted); }
.empty .ico { font-size: 2rem; display: block; margin-bottom: .3rem; }
.error-box { text-align: center; padding: 2rem 1rem; }
.error-box p { color: var(--bad); }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; justify-content: space-between; gap: .8rem; padding: .6rem 0; border-bottom: 1px solid var(--line); align-items: center; }
.list li:last-child { border-bottom: 0; }
.kv { display: grid; grid-template-columns: 160px 1fr; gap: .35rem 1rem; font-size: .92rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-word; }
.tabs { display: flex; gap: .3rem; border-bottom: 1px solid var(--line); margin-bottom: 1rem; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: .6rem .9rem; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.active { color: var(--primary); border-bottom-color: var(--primary); }
.donut { width: 150px; height: 150px; border-radius: 50%; position: relative; flex: none; }
.donut::after { content: ''; position: absolute; inset: 26px; background: var(--surface); border-radius: 50%; }
.donut-center { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; text-align: center; font-weight: 700; font-size: 1.3rem; line-height: 1.1; }
.donut-center small { display: block; font-size: .72rem; color: var(--muted); font-weight: 400; }
.legend { list-style: none; padding: 0; margin: 0; font-size: .88rem; }
.legend li { display: flex; align-items: center; gap: .5rem; padding: .18rem 0; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.chart-row { display: flex; gap: 1.4rem; align-items: center; flex-wrap: wrap; }
.dept-bars .item { margin-bottom: .75rem; }

/* ---------- Table ---------- */
.table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--line); }
table.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; background: var(--surface); }
.tbl th { text-align: left; font-weight: 600; color: var(--muted); background: var(--surface-2); padding: .65rem .75rem; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: .82rem; }
.tbl td { padding: .65rem .75rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: #fafbfe; }
.tbl .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl tfoot td { font-weight: 700; background: var(--surface-2); }
.cell-title { font-weight: 600; }
.cell-sub { font-size: .8rem; color: var(--muted); }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: .3rem; }
.field label { font-weight: 600; font-size: .88rem; }
.field label .req { color: var(--bad); }
.input, select.input, textarea.input { width: 100%; padding: .58rem .75rem; border: 1px solid #d0d7e2; border-radius: 9px; background: #fff; outline: none; transition: border-color .15s, box-shadow .15s; }
.input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 118, 110, .18); }
textarea.input { min-height: 90px; resize: vertical; }
.help { font-size: .78rem; color: var(--muted); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .9rem 1rem; }
.form-grid .full { grid-column: 1 / -1; }
.form-error { background: var(--bad-soft); color: var(--bad); padding: .65rem .8rem; border-radius: 9px; margin-top: 1rem; font-size: .9rem; }
.stack { display: flex; flex-direction: column; gap: .9rem; }
.switch { display: inline-flex; align-items: center; gap: .5rem; cursor: pointer; }

/* ---------- Modal / confirm ---------- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, .5); z-index: 150; display: flex; align-items: flex-start; justify-content: center; padding: 4vh 1rem; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 16px; width: min(720px, 100%); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; max-height: 92vh; animation: pop .18s ease-out; }
.modal.lg { width: min(1040px, 100%); }
.modal.sm { width: min(440px, 100%); }
@keyframes pop { from { transform: translateY(10px) scale(.98); opacity: 0; } }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); gap: 1rem; }
.modal-head h3 { font-size: 1.08rem; }
.modal-close { border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 9px; cursor: pointer; font-size: 1.1rem; flex: none; }
.modal-body { padding: 1.2rem 1.25rem; overflow-y: auto; }
.modal-foot { padding: .9rem 1.25rem; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: .5rem; flex-wrap: wrap; }
.confirm-text { font-size: 1rem; margin: 0; }

/* ---------- Toast ---------- */
.toasts { position: fixed; right: 1rem; bottom: 1rem; z-index: 220; display: flex; flex-direction: column; gap: .5rem; max-width: min(380px, calc(100vw - 2rem)); }
.toast { background: #1f2937; color: #fff; padding: .75rem 1rem; border-radius: 10px; box-shadow: var(--shadow-lg); font-size: .92rem; display: flex; gap: .6rem; align-items: flex-start; animation: pop .2s ease-out; }
.toast.success { background: #0f766e; }
.toast.error { background: #b42318; }
.toast.warn { background: #9a6700; }
.toast button { margin-left: auto; background: none; border: 0; color: inherit; cursor: pointer; opacity: .7; font-size: 1rem; }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) {
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 1024px) and (min-width: 769px) {
  :root { --side-w: 76px; }
  .side-brand { justify-content: center; padding: 1rem .5rem; }
  .side-brand > div:not(.brand-mark), .nav .label, .nav-group, .side-user { display: none; }
  .nav button { justify-content: center; padding: .7rem 0; }
  .nav .ico { font-size: 1.2rem; }
}
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); width: 270px; box-shadow: var(--shadow-lg); }
  .app.menu-open .sidebar { transform: none; }
  .main { margin-left: 0; }
  .menu-btn { display: inline-grid; place-items: center; }
  .header { padding: .7rem .9rem; }
  .chip-user { display: none; }
  .content { padding: .9rem; }
  .grid-2, .grid-3, .form-grid { grid-template-columns: 1fr; }
  .kv { grid-template-columns: 1fr; }
  .kv dt { margin-top: .4rem; }
  .stat .value { font-size: 1.3rem; }
  .table-wrap.cards { border: 0; overflow: visible; }
  .cards table.tbl, .cards .tbl tbody, .cards .tbl tr, .cards .tbl td { display: block; width: 100%; }
  .cards .tbl thead { display: none; }
  .cards .tbl tr { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: .7rem; padding: .3rem .2rem; }
  .cards .tbl td { border: 0; display: flex; justify-content: space-between; gap: 1rem; padding: .35rem .7rem; text-align: right; }
  .cards .tbl td::before { content: attr(data-label); color: var(--muted); font-size: .8rem; text-align: left; flex: none; max-width: 45%; }
  .cards .tbl td.num { white-space: normal; }
  .cards .tbl tfoot { display: block; }
  .cards .tbl tfoot tr { background: var(--surface-2); }
  .modal-backdrop { padding: 0; align-items: flex-end; }
  .modal, .modal.lg, .modal.sm { width: 100%; max-height: 94vh; border-radius: 16px 16px 0 0; }
  .toasts { left: 1rem; right: 1rem; max-width: none; }
}
@media print {
  .sidebar, .header, .toolbar, .btn, .toasts { display: none !important; }
  .main { margin: 0; }
}

/* ---------- Classroom extras ---------- */
.section-switch { min-width: 150px; width: auto; padding: .42rem .6rem; font-size: .88rem; }
.public-wrap { min-height: 100vh; padding: 1.5rem 1rem 2rem; background: radial-gradient(circle at 20% 20%, #155e75, #10242c 60%); display: flex; flex-direction: column; align-items: center; gap: 1rem; }
.public-card { width: min(480px, 100%); background: var(--surface); border-radius: 18px; padding: 1.6rem 1.5rem; box-shadow: var(--shadow-lg); }
.public-card h2 { font-size: 1.25rem; margin-bottom: .2rem; }
.public-links { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; }
.public-links .btn { background: rgba(255, 255, 255, .12); color: #fff; }
.schedule-mini { width: min(480px, 100%); background: rgba(255, 255, 255, .08); color: #e2f3f0; border-radius: 14px; padding: .9rem 1.1rem; font-size: .9rem; }
.schedule-mini table { width: 100%; border-collapse: collapse; }
.schedule-mini td { padding: .25rem .3rem; }
.code-input { font-family: 'Courier New', monospace; font-size: 1.6rem; letter-spacing: .35em; text-transform: uppercase; text-align: center; font-weight: 700; }
.result-ok { text-align: center; padding: .5rem 0; }
.result-ok .big { font-size: 3rem; line-height: 1; }
.session-info { background: var(--primary-soft); color: var(--primary-2); border-radius: 10px; padding: .7rem .9rem; font-size: .92rem; margin-bottom: 1rem; }
.live-grid { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: 1rem; align-items: start; }
.qr-box { text-align: center; }
.qr-box svg { width: 100%; max-width: 360px; height: auto; border-radius: 10px; }
.live-code { font-family: 'Courier New', monospace; font-size: 2.6rem; font-weight: 700; letter-spacing: .3em; color: var(--primary-2); margin: .3rem 0; }
.countdown { height: 6px; background: #e6ece9; border-radius: 99px; overflow: hidden; margin: .5rem auto; max-width: 360px; }
.countdown span { display: block; height: 100%; background: var(--primary); transition: width 1s linear; }
.live-counts { display: grid; grid-template-columns: repeat(5, 1fr); gap: .4rem; margin-top: .8rem; }
.live-counts div { background: var(--surface-2); border-radius: 10px; padding: .5rem .2rem; text-align: center; font-size: .78rem; color: var(--muted); }
.live-counts strong { display: block; font-size: 1.35rem; color: var(--text); }
.bulk-bar { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; padding: .6rem; background: var(--surface-2); border-radius: 10px; margin-bottom: .7rem; }
body.presenting .sidebar, body.presenting .header, body.presenting .live-roster { display: none !important; }
body.presenting .main { margin-left: 0; }
body.presenting .live-grid { grid-template-columns: 1fr; justify-items: center; }
body.presenting .qr-box svg { max-width: min(70vh, 90vw); }
body.presenting .live-code { font-size: 4rem; }
.matrix td, .matrix th { text-align: center; padding: .4rem .35rem; }
.matrix td:nth-child(-n+2), .matrix th:nth-child(-n+2) { text-align: left; }
.mk { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; font-size: .78rem; font-weight: 700; background: var(--surface-2); color: var(--muted); border: 0; cursor: default; }
button.mk { cursor: pointer; }
.mk.present { background: var(--ok-soft); color: var(--ok); }
.mk.late { background: var(--warn-soft); color: var(--warn); }
.mk.absent { background: var(--bad-soft); color: var(--bad); }
.mk.excused { background: var(--info-soft); color: var(--info); }
.checks { display: flex; flex-wrap: wrap; gap: .4rem .9rem; padding: .4rem 0; }
.checks label { display: inline-flex; align-items: center; gap: .35rem; font-weight: 500; }
.score-input { width: 90px; text-align: right; }
.fb-input { min-width: 180px; min-height: 38px; }
.file-chip { display: inline-flex; gap: .35rem; align-items: center; background: var(--surface-2); border-radius: 7px; padding: .15rem .5rem; font-size: .8rem; margin: .12rem .2rem .12rem 0; }
.cap-grid td.num { font-variant-numeric: tabular-nums; }
.assign-card { border: 1px solid var(--line); border-radius: 12px; padding: .9rem 1rem; margin-bottom: .7rem; display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; flex-wrap: wrap; }
.assign-card h3 { font-size: 1rem; }

/* =========================================================================
 * SERVER CALLS — google.script.run พร้อม Success/Failure Handler + Loading
 * ========================================================================= */
function serverCall(fn, args) {
  return new Promise(function (resolve, reject) {
    setBusy(1);
    var runner = google.script.run
      .withSuccessHandler(function (res) {
        setBusy(-1);
        if (res && res.success) { resolve(res); return; }
        var message = (res && res.message) || 'เกิดข้อผิดพลาด';

      .withFailureHandler(function () {
        setBusy(-1);
        reject(new Error('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่'));
      });
    runner[fn].apply(runner, args || []);
  });

function api(fn) {
  var args = [S.token];
  for (var i = 1; i < arguments.length; i++) args.push(arguments[i]);
  return serverCall(fn, args);
}

function setBusy(delta) {

}

function withButton(btn, promise) {
  if (!btn) return promise;
  var html = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>' + html;
  var restore = function () { btn.disabled = false; btn.innerHTML = html; };
  return promise.then(function (r) { restore(); return r; }, function (e) { restore(); throw e; });

/* =========================================================================

/* =========================================================================
 * TOAST / CONFIRMATION DIALOG / MODAL
 * ========================================================================= */
function toast(message, type) {
  var t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.innerHTML = '<span>' + esc(message) + '</span><button type="button" aria-label="ปิด">✕</button>';
  t.querySelector('button').addEventListener('click', function () { t.remove(); });
  var box = el('toasts');
  box.appendChild(t);
  while (box.children.length > 3) box.removeChild(box.firstChild);
  setTimeout(function () { t.remove(); }, type === 'error' ? 7000 : 4000);
}

function confirmBox(message, opts) {
  opts = opts || {};
  return new Promise(function (resolve) {
    el('confirm-title').textContent = opts.title || 'ยืนยันการทำรายการ';
    el('confirm-text').textContent = message;
    var ok = el('confirm-ok');
    ok.textContent = opts.okText || 'ยืนยัน';
    ok.className = 'btn ' + (opts.danger === false ? 'primary' : 'danger');
    el('confirm-root').hidden = false;
    var done = function (v) {
      el('confirm-root').hidden = true;
      ok.onclick = null;
      el('confirm-cancel').onclick = null;

    };

}

function openModal(opts) {

/* ---------- Generic form ---------- */
function fieldHtml(f, values) {
  var v = values[f.name] !== undefined && values[f.name] !== null ? values[f.name] : (f.value !== undefined ? f.value : '');
  var id = 'f-' + f.name;
  var attrs = ' id="' + id + '" name="' + f.name + '"' + (f.required === true ? ' required' : '') + (f.maxlength ? ' maxlength="' + f.maxlength + '"' : '') + (f.disabled ? ' disabled' : '');
  var input;
  if (f.type === 'select') {
    input = '<select class="input"' + attrs + '>' + (f.placeholder !== undefined ? '<option value="">' + esc(f.placeholder) + '</option>' : '') +
      (f.options || []).map(function (o) { return '<option value="' + esc(o.value) + '"' + (String(o.value) === String(v) ? ' selected' : '') + '>' + esc(o.label) + '</option>'; }).join('') + '</select>';
  } else if (f.type === 'textarea') {
    input = '<textarea class="input"' + attrs + ' rows="' + (f.rows || 3) + '">' + esc(v) + '</textarea>';
  } else if (f.type === 'file') {
    input = '<input class="input" type="file"' + attrs + (f.multiple ? ' multiple' : '') + (f.accept ? ' accept="' + esc(f.accept) + '"' : '') + '>';
  } else if (f.type === 'checks') {
    var chosen = Array.isArray(v) ? v : [];
    input = '<div class="checks" id="' + id + '">' + (f.options || []).map(function (o) {
      return '<label><input type="checkbox" name="' + f.name + '" value="' + esc(o.value) + '"' + (chosen.indexOf(o.value) >= 0 ? ' checked' : '') + '> ' + esc(o.label) + '</label>';
    }).join('') + '</div>';
  } else {
    var type = f.type === 'number' ? 'number' : (f.type || 'text');
    var extra = (f.min !== undefined ? ' min="' + f.min + '"' : '') + (f.max !== undefined ? ' max="' + f.max + '"' : '') + (f.step ? ' step="' + f.step + '"' : '') + (f.autocomplete ? ' autocomplete="' + f.autocomplete + '"' : '') + (f.inputmode ? ' inputmode="' + f.inputmode + '"' : '');
    input = '<input class="input" type="' + type + '"' + attrs + extra + ' value="' + esc(v) + '"' + (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : '') + '>';
  }
  return '<div class="field' + (f.full ? ' full' : '') + '" data-field="' + f.name + '"' + (f.hidden ? ' hidden' : '') + '><label for="' + id + '">' + esc(f.label) + (f.required ? ' <span class="req">*</span>' : '') + '</label>' + input +
    '<span class="help" id="help-' + f.name + '">' + esc(f.help || '') + '</span></div>';
}

function collectForm(form, fields) {
  var data = {};
  fields.forEach(function (f) {
    if (f.type === 'checks') {
      data[f.name] = Array.prototype.map.call(form.querySelectorAll('input[name="' + f.name + '"]:checked'), function (c) { return c.value; });
      return;
    }
    var input = form.elements[f.name];
    if (!input) return;
    if (f.type === 'file') data[f.name] = input.files ? Array.prototype.slice.call(input.files) : [];
    else data[f.name] = String(input.value === undefined ? '' : input.value).trim();
  });
  return data;
}

function validateFields(fields, data, form) {
  for (var i = 0; i < fields.length; i++) {
    var f = fields[i];
    var wrap = form.querySelector('[data-field="' + f.name + '"]');
    if (wrap && wrap.hidden) continue;
    var v = data[f.name];
    var required = typeof f.required === 'function' ? f.required(data) : f.required;
    var empty = v === null || v === undefined || v === '' || (Array.isArray(v) && !v.length);
    if (required && empty) return 'กรุณากรอก "' + f.label + '"';
    if (!empty && f.type === 'number') {
      if (!/^-?\d+(\.\d+)?$/.test(v)) return '"' + f.label + '" ต้องเป็นตัวเลข';
      var n = Number(v);
      if (f.min !== undefined && n < f.min) return '"' + f.label + '" ต้องไม่น้อยกว่า ' + f.min;
      if (f.max !== undefined && n > f.max) return '"' + f.label + '" ต้องไม่เกิน ' + f.max;
      if (f.positive && n <= 0) return '"' + f.label + '" ต้องมากกว่า 0';
    }
    if (!empty && f.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return 'รูปแบบอีเมลไม่ถูกต้อง';
    if (!empty && f.type === 'file') {
      var max = (Number(S.settings.maxUploadMB) || 20) * 1048576;
      var total = v.reduce(function (t, x) { return t + x.size; }, 0);
      if (total > max) return 'ไฟล์รวมกันเกิน ' + S.settings.maxUploadMB + ' MB';
    }
  }
  return '';
}

function openForm(cfg) {
  var values = cfg.values || {};
  openModal({
    title: cfg.title,
    size: cfg.size || '',
    body: (cfg.intro || '') + '<form id="modal-form" novalidate><div class="form-grid">' + cfg.fields.map(function (f) { return fieldHtml(f, values); }).join('') + '</div><div class="form-error" id="form-error" hidden></div></form>',
    footer: '<button class="btn ghost" type="button" data-act="modal-close">ยกเลิก</button><button class="btn primary" type="submit" form="modal-form" id="modal-submit">' + esc(cfg.submitText || 'บันทึก') + '</button>'
  });
  var form = el('modal-form');
  var errBox = el('form-error');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errBox.hidden = true;
    var data = collectForm(form, cfg.fields);
    var err = validateFields(cfg.fields, data, form) || (cfg.validate ? cfg.validate(data, form) : '');
    if (err) { errBox.textContent = err; errBox.hidden = false; return; }
    withButton(el('modal-submit'), Promise.resolve().then(function () { return cfg.onSubmit(data, form); }))
      .then(function (res) {
        if (cfg.keepOpen) { if (cfg.after) cfg.after(res); return; }
        closeModal();
        toast((res && res.message) || 'บันทึกแล้ว', 'success');
        if (cfg.after) cfg.after(res);
      })
      .catch(function (error) { errBox.textContent = error.message; errBox.hidden = false; });
  });
  if (cfg.onReady) cfg.onReady(form);
  var first = form.querySelector('input:not([type=hidden]):not([disabled]):not([type=checkbox]), select, textarea');
  if (first) first.focus();
}

function readUploads(files) {
  return Promise.all((files || []).map(function (file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { var s = String(reader.result || ''); resolve({ name: file.name, mimeType: file.type || 'application/octet-stream', data: s.slice(s.indexOf(',') + 1) }); };
      reader.onerror = function () { reject(new Error('อ่านไฟล์ไม่สำเร็จ: ' + file.name)); };
      reader.readAsDataURL(file);
    });
  }));
}

function table(columns, rows, opts) {

  var head = '<tr>' + columns.map(function (c) { return '<th class="' + (c.num ? 'num' : '') + '">' + esc(c.label) + '</th>'; }).join('') + '</tr>';
  var body = rows.map(function (r) {
    return '<tr' + (opts.rowAttr ? opts.rowAttr(r) : '') + '>' + columns.map(function (c) { return '<td data-label="' + esc(c.label) + '" class="' + (c.num ? 'num' : '') + '">' + c.render(r) + '</td>'; }).join('') + '</tr>';
  }).join('');
  return '<div class="table-wrap ' + (opts.noCards ? '' : 'cards') + '"><table class="tbl ' + (opts.cls || '') + '"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
}
function emptyState(msg, icon) { return '<div class="empty"><span class="ico">' + (icon || '◌') + '</span>' + esc(msg) + '</div>'; }
function errorState(msg) { return '<div class="card error-box"><p>' + esc(msg) + '</p><button class="btn primary" type="button" data-act="refresh">ลองใหม่</button></div>'; }

  var lines = '<div class="card">' + [80, 95, 70, 90, 60, 85, 75].map(function (w) { return '<div class="sk sk-line" style="width:' + w + '%"></div>'; }).join('') + '</div>';

}
function selectFilter(name, value, options, placeholder) {

    options.map(function (o) { return '<option value="' + esc(o.value) + '"' + (String(o.value) === String(value || '') ? ' selected' : '') + '>' + esc(o.label) + '</option>'; }).join('') + '</select>';

function menu() { return isTeacher() ? TEACHER_MENU : STUDENT_MENU; }
function allowed(m) { return !m.roles || m.roles.indexOf(S.user.role) >= 0; }

  var items = menu();
  if (S.user.mustChange) items = items.filter(function (m) { return m.id === 'account'; });
  el('nav').innerHTML = items.filter(function (m) { return m.group || allowed(m); }).map(function (m) {
    if (m.group) return '<div class="nav-group">' + esc(m.group) + '</div>';
    return '<button type="button" data-act="nav" data-view="' + m.id + '" title="' + esc(m.label) + '"><span class="ico">' + m.icon + '</span><span class="label">' + esc(m.label) + '</span></button>';
  }).join('');
  var sw = el('section-switch');
  sw.hidden = !isTeacher();
  if (isTeacher()) {
    sw.innerHTML = '<option value="">ทุกกลุ่มเรียน</option>' + S.sections.map(function (s) { return '<option value="' + esc(s.code) + '"' + (s.code === S.section ? ' selected' : '') + '>' + esc(s.name) + ' · ' + esc(dayLabel(s.meetingDay)) + '</option>'; }).join('');
  }
}

function stopTimers() { S.timers.forEach(function (t) { clearInterval(t); }); S.timers = []; document.body.classList.remove('presenting'); }

function navigate(id, params) {
  stopTimers();
  if (S.user.mustChange) id = 'account';
  var menuId = HIDDEN_VIEWS[id] || id;
  var m = menu().filter(function (x) { return x.id === menuId; })[0];
  if (!VIEWS[id] || !m || !allowed(m)) { id = isTeacher() ? 'dashboard' : 'home'; menuId = id; }
  S.view = id;
  S.params = params || {};
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function (b) { b.classList.toggle('active', b.getAttribute('data-view') === menuId); });
  el('view-title').textContent = VIEWS[id].title;
  closeMenu();
  window.scrollTo(0, 0);
  loadView(false);
}

function loadView(silent) {
  var id = S.view;
  var v = VIEWS[id];
  var seq = ++S.seq;
  if (!silent) el('view').innerHTML = skeleton();
  return Promise.resolve().then(function () { return v.load(S.params); }).then(function (data) {
    if (seq !== S.seq) return;
    S.data[id] = data;
    v.render(data);
  }).catch(function (err) {
    if (seq !== S.seq || !S.token) return;
    if (silent) toast(err.message, 'error');
    else el('view').innerHTML = errorState(err.message);
  });
}

function refreshView() { return loadView(true); }
function closeMenu() { el('app').classList.remove('menu-open'); el('backdrop').hidden = true; }

function bindSettingsForms() {
  var sf = el('settings-form');
  if (sf && isAdmin()) {
    sf.addEventListener('submit', function (e) {
      e.preventDefault();
      var box = el('settings-error');
      box.hidden = true;
      var data = {};
      ['courseCode', 'courseName', 'semester', 'academicYear', 'lateMinutes', 'deviceLock', 'maxUploadMB', 'backupRetention'].forEach(function (k) { data[k] = sf.elements[k].value.trim(); });
      var err = '';
      if (!data.courseCode || !data.courseName || !data.semester || !data.academicYear) err = 'กรุณากรอกข้อมูลรายวิชาให้ครบ';
      else if (!/^\d+$/.test(data.lateMinutes) || Number(data.lateMinutes) > 240) err = 'นาทีที่ถือว่าสายต้องเป็นจำนวนเต็ม 0–240';
      else if (!/^\d+$/.test(data.maxUploadMB) || Number(data.maxUploadMB) < 1 || Number(data.maxUploadMB) > 40) err = 'ขนาดไฟล์ต้องเป็นจำนวนเต็ม 1–40 MB';
      else if (!/^\d+$/.test(data.backupRetention) || Number(data.backupRetention) < 1 || Number(data.backupRetention) > 365) err = 'จำนวนไฟล์สำรองต้องเป็นจำนวนเต็ม 1–365';
      if (err) { box.textContent = err; box.hidden = false; return; }
      withButton(el('settings-submit'), api('saveSettings', data)).then(function (res) {
        S.settings = res.data.settings;
        S.course.courseCode = S.settings.courseCode; S.course.courseName = S.settings.courseName; S.course.semester = S.settings.semester; S.course.academicYear = S.settings.academicYear;
        applyCourse();
        toast(res.message, 'success');
      }).catch(function (error) { box.textContent = error.message; box.hidden = false; });
    });
  }
  var tf = el('term-form');
  if (tf) {
    tf.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = el('term-start').value;
      if (!v) { toast('กรุณาเลือกวันเปิดภาคเรียน', 'error'); return; }
      confirmBox('คำนวณวันเรียนสัปดาห์ที่ 1 ของทุกกลุ่มจากวันที่ ' + dateTH(v) + ' และเลื่อนวันที่ของคาบที่ยังไม่เปิดเช็คชื่อ?', { danger: false }).then(function (yes) {
        if (!yes) return;
        withButton(el('term-submit'), api('setTermStart', v)).then(function (res) { setSections(res.data.items); toast(res.message, 'success'); refreshView(); }).catch(function (err) { toast(err.message, 'error'); });
      });
    });
  }
  bindPasswordForm();
}

function bindPasswordForm() {
  var pf = el('password-form');
  if (!pf) return;
  pf.addEventListener('submit', function (e) {
    e.preventDefault();
    var box = el('password-error');
    box.hidden = true;
    var data = { currentPassword: pf.elements.currentPassword.value, newPassword: pf.elements.newPassword.value, confirmPassword: pf.elements.confirmPassword.value };
    var err = '';
    if (!data.currentPassword || !data.newPassword || !data.confirmPassword) err = 'กรุณากรอกข้อมูลให้ครบ';
    else if (data.newPassword.length < S.meta.minPasswordLength) err = 'รหัสผ่านใหม่ต้องมีอย่างน้อย ' + S.meta.minPasswordLength + ' ตัวอักษร';
    else if (data.newPassword === '123456') err = 'ห้ามใช้รหัสผ่านเริ่มต้นเป็นรหัสผ่านใหม่';
    else if (data.newPassword !== data.confirmPassword) err = 'ยืนยันรหัสผ่านไม่ตรงกัน';
    else if (data.newPassword === data.currentPassword) err = 'รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสผ่านเดิม';
    if (err) { box.textContent = err; box.hidden = false; return; }
    withButton(el('password-submit'), api('changeMyPassword', data)).then(function (res) {
      pf.reset();
      hidePasswords(pf);
      toast(res.message, 'success');
      var wasForced = S.user.mustChange;
      applyBootstrap(res.data.bootstrap);
      if (wasForced) navigate('home');
    }).catch(function (error) { box.textContent = error.message; box.hidden = false; });
  });
}

/** ลายนิ้วมืออุปกรณ์แบบไม่บันทึกลงเครื่อง (ใช้ตรวจ 1 เครื่อง : 1 คน ต่อคาบ) */
function computeDeviceHash() {
  var parts = [navigator.userAgent, navigator.language, (navigator.languages || []).join(','), screen.width + 'x' + screen.height + 'x' + screen.colorDepth, window.devicePixelRatio,
    new Date().getTimezoneOffset(), navigator.hardwareConcurrency || '', navigator.maxTouchPoints || '', navigator.platform || ''];
  try {
    var c = document.createElement('canvas');
    c.width = 200; c.height = 40;
    var x = c.getContext('2d');
    x.textBaseline = 'top'; x.font = '16px Arial'; x.fillStyle = '#f60'; x.fillRect(0, 0, 80, 20); x.fillStyle = '#069'; x.fillText('2D animation ก๏', 2, 2);
    parts.push(c.toDataURL().slice(-64));
  } catch (e) { parts.push('nocanvas'); }
  var text = parts.join('|');
  if (window.crypto && crypto.subtle && window.TextEncoder) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    }).catch(function () { return simpleHash(text); });
  }
  return Promise.resolve(simpleHash(text));
}
function simpleHash(s) {
  var h1 = 0x811c9dc5, h2 = 0x01000193;
  for (var i = 0; i < s.length; i++) { h1 = Math.imul(h1 ^ s.charCodeAt(i), 16777619) >>> 0; h2 = Math.imul(h2 + s.charCodeAt(i), 2246822519) >>> 0; }
  return ('00000000' + h1.toString(16)).slice(-8) + ('00000000' + h2.toString(16)).slice(-8);
}

/* ---------- Import ClassRoster CSV ---------- */
function parseCsv(text) {
  var rows = [], row = [], cell = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text.charAt(i);
    if (q) {
      if (ch === '"') { if (text.charAt(i + 1) === '"') { cell += '"'; i++; } else q = false; } else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',' || ch === '\t') { row.push(cell.trim()); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text.charAt(i + 1) === '\n') i++; row.push(cell.trim()); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell.trim()); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (c) { return c !== ''; }); });
}

/** รองรับไฟล์ ClassRoster ของระบบทะเบียน และ CSV ทั่วไป (รหัส, ชื่อ, กลุ่ม) */
function parseRoster(text, fallbackSection) {
  var rows = parseCsv(text.replace(/^﻿/, ''));
  var out = [], section = fallbackSection;
  if (rows.length && /รหัสวิชา/.test(rows[0][0] || '')) {
    var h = rows[0], v = rows[1] || [];
    var gi = h.findIndex(function (x) { return /กลุ่ม/.test(x); });
    if (gi >= 0 && v[gi]) section = String(v[gi]).replace(/^0+(?=\d)/, '');
    var start = rows.findIndex(function (r) { return /^ลำดับ/.test(r[0] || ''); });
    var cols = start >= 0 ? rows[start] : [];
    var idx = function (re, d) { var k = cols.findIndex(function (c) { return re.test(c); }); return k >= 0 ? k : d; };
    var ic = idx(/รหัส/, 1), inm = idx(/ชื่อ/, 2), ip = idx(/สาขา/, 3), ifc = idx(/คณะ/, 4);
    rows.slice(start + 1).forEach(function (r) { if (r[ic]) out.push({ studentCode: r[ic], fullName: r[inm], program: r[ip] || '', faculty: r[ifc] || '', sectionCode: section }); });
  } else {
    var header = rows[0] || [];
    var hasHeader = header.some(function (c) { return /รหัส|code|ชื่อ|name/i.test(c); });
    var col = function (re, d) { var k = header.findIndex(function (c) { return re.test(c); }); return hasHeader && k >= 0 ? k : d; };
    var c1 = col(/รหัส|code/i, 0), c2 = col(/ชื่อ|name/i, 1), c3 = col(/กลุ่ม|sec/i, 2);
    rows.slice(hasHeader ? 1 : 0).forEach(function (r) { if (r[c1]) out.push({ studentCode: r[c1], fullName: r[c2] || '', sectionCode: (r[c3] || fallbackSection || '').replace(/^0+(?=\d)/, '') }); });
  }
  return out;
}

function readText(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () {
      var buf = reader.result;
      try { resolve(new TextDecoder('utf-8', { fatal: true }).decode(buf)); } catch (e) {
        try { resolve(new TextDecoder('windows-874').decode(buf)); } catch (e2) { reject(new Error('อ่านไฟล์ไม่ได้: ' + file.name)); }
      }
    };
    reader.onerror = function () { reject(new Error('อ่านไฟล์ไม่ได้: ' + file.name)); };
    reader.readAsArrayBuffer(file);
  });
}

function downloadFile(id, btn) {
  withButton(btn, api('downloadFile', id)).then(function (res) {
    var d = res.data;
    var bin = atob(d.data);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes], { type: d.mimeType || 'application/octet-stream' }));
    var a = document.createElement('a');
    a.href = url;
    a.download = d.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }).catch(function (err) { toast(err.message, 'error'); });
}

function confirmAndRun(message, btn, fn, args, after) {
  confirmBox(message).then(function (yes) {
    if (!yes) return;
    withButton(btn, api.apply(null, [fn].concat(args))).then(function (res) {
      toast(res.message, 'success');
      if (after) after(res); else refreshView();
    }).catch(function (err) { toast(err.message, 'error'); });
  });
}

function collectGrades() {
  var out = [];
  Array.prototype.forEach.call(document.querySelectorAll('[data-score]'), function (inp) {
    var code = inp.getAttribute('data-score');
    var fb = document.querySelector('[data-feedback="' + code + '"]');
    var row = S.data.grading.grading.rows.filter(function (r) { return r.studentCode === code; })[0];
    var oldScore = row && row.grade && row.grade.score !== '' ? String(row.grade.score) : '';
    var oldFb = row && row.grade ? row.grade.feedback : '';
    var score = inp.value.trim();
    var feedback = fb ? fb.value.trim() : '';
    if (score !== oldScore || feedback !== oldFb || (score !== '' && row && row.grade && row.grade.status === 'draft')) out.push({ studentCode: code, score: score, feedback: feedback });
  });
  return out;
}

  },
  'backup-delete': function (t) {
    confirmAndRun('ลบไฟล์สำรองข้อมูลนี้?', t, 'deleteBackup', [t.getAttribute('data-id')], function (res) {
      var b = S.data.settings.backups || {};
      b.items = res.data.items;
      VIEWS.settings.renderBackups(b);
    });
  },
  'backup-toggle': function (t) {
    var enabled = t.checked;
    t.disabled = true;
    api('setDailyBackup', enabled).then(function (res) { t.disabled = false; S.data.settings.backups.dailyBackupActive = enabled; toast(res.message, 'success'); })
      .catch(function (err) { t.disabled = false; t.checked = !enabled; toast(err.message, 'error'); });
  }
};

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]');
  if (!t) return;
  var act = t.getAttribute('data-act');
  if (act === 'backup-toggle') return;
  if (t.tagName === 'A') e.preventDefault();
  if (act === 'menu-close' && t.id !== 'backdrop') return;
  var fn = ACTIONS[act];
  if (fn) fn(t, e);
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (!t.getAttribute) return;
  if (t.getAttribute('data-act') === 'backup-toggle') { ACTIONS['backup-toggle'](t); return; }
  if (t.id === 'section-switch') {
    S.section = t.value;
    var v = VIEWS[S.view];
    if (!v || S.view === 'live') return;
    if (S.view === 'attendance' || S.view === 'gradebook') loadView(false);
    else if (S.data[S.view]) v.render(S.data[S.view]);
    return;
  }
  if (t.getAttribute('data-filter') && t.type !== 'search') applyFilter(t);
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.getAttribute && t.getAttribute('data-filter') && t.type === 'search') applyFilter(t);
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (!el('confirm-root').hidden) { el('confirm-cancel').click(); return; }
  if (!el('modal-root').hidden) { closeModal(); return; }
  if (document.body.classList.contains('presenting')) { document.body.classList.remove('presenting'); return; }
  closeMenu();
});
el('modal-root').addEventListener('click', function (e) { if (e.target === el('modal-root')) closeModal(); });

function applyFilter(input) {
  var v = VIEWS[S.view];
  if (!v || !v.renderList || !S.data[S.view]) return;
  filter(S.view)[input.getAttribute('data-filter')] = input.value;
  v.renderList(S.data[S.view]);
}

/* =========================================================================
 * LOGIN / LOGOUT / BOOTSTRAP
 * ========================================================================= */
el('login-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var box = el('login-error');
  box.hidden = true;
  var username = el('login-username').value.trim();
  var password = el('login-password').value;
  if (!username || !password) { box.textContent = 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'; box.hidden = false; return; }
  withButton(el('login-submit'), serverCall('login', [username, password])).then(function (res) {
    S.token = res.data.token;
    el('login-password').value = '';
    hidePasswords(el('login-form'));
    applyBootstrap(res.data.bootstrap);
    el('login-view').hidden = true;
    el('public-view').hidden = true;
    el('app').hidden = false;
    toast('ยินดีต้อนรับ ' + S.user.fullName, 'success');
    navigate(S.user.mustChange ? 'account' : S.startCode && !isTeacher() ? 'checkin' : isTeacher() ? 'dashboard' : 'home');
  }).catch(function (err) { box.textContent = err.message; box.hidden = false; });
});

function applyBootstrap(b) {
  S.user = b.user;
  S.settings = b.settings;
  S.course = b.course;
  S.sections = b.sections;
  S.meta = b.meta;
  S.appUrl = b.appUrl;
  S.bootDashboard = b.dashboard || null;
  S.student = b.student || null;
  S.data = {};
  S.filters = {};
  S.reg = {};
  el('side-user-name').textContent = b.user.fullName;
  el('side-user-role').textContent = b.user.roleLabel + (b.user.sectionCode ? ' · กลุ่ม ' + b.user.sectionCode : '');
  el('hdr-user-name').textContent = b.user.fullName;
  el('hdr-user-role').textContent = b.user.roleLabel;
  applyCourse();
  renderNav();
}

function applyCourse() {
  var c = S.course || {};
  el('side-org').textContent = (c.courseCode || '') + ' · ' + (c.semester || '') + '/' + (c.academicYear || '');
  el('header-org').textContent = (c.courseCode || '') + ' ' + (c.courseName || '');
}

function doLogout() {
  confirmBox('ออกจากระบบ?', { okText: 'ออกจากระบบ', danger: false }).then(function (yes) {
    if (!yes) return;
    showLoading('กำลังออกจากระบบ');
    serverCall('logout', [S.token]).then(function () { hideLoading(); resetSession(); toast('ออกจากระบบแล้ว', 'success'); })
      .catch(function () { hideLoading(); resetSession(); });
  });
}

function resetSession() {
  stopTimers();
  S.token = '';
  S.user = null;
  S.data = {};
  S.reg = {};
  S.student = null;
  S.seq += 1;
  closeModal();
  el('confirm-root').hidden = true;
  el('app').hidden = true;
  el('view').innerHTML = '';
  showLogin();
}

function showLogin() {
  el('public-view').hidden = true;
  el('login-view').hidden = false;
  el('login-username').focus();
  renderPublicSchedule();
}

function showPublicCheckin(code) {
  el('login-view').hidden = true;
  el('public-view').hidden = false;
  el('public-card').innerHTML = checkinFormHtml('pub');
  bindCheckinForm('pub', '', code);
}

function renderPublicSchedule() {
  var p = S.publicInfo;
  if (!p) return;
  el('login-course').textContent = p.course.courseCode + ' ' + p.course.courseName + ' · ภาคเรียน ' + p.course.semester + '/' + p.course.academicYear;
  el('login-schedule').innerHTML = '<strong>ตารางเรียน</strong><table>' + p.sections.map(function (s) { return '<tr><td>' + esc(s.name) + '</td><td>วัน' + esc(s.dayLabel) + '</td><td>' + esc(s.startTime) + '–' + esc(s.endTime) + '</td><td>' + esc(s.room) + '</td></tr>'; }).join('') + '</table>';
  el('login-schedule').hidden = false;
}

/* ---------- ปุ่มแสดง/ซ่อนรหัสผ่าน (ใส่ให้ทุกช่องรหัสผ่านอัตโนมัติ) ---------- */
var EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
var EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
function hidePasswords(root) {
  Array.prototype.forEach.call((root || document).querySelectorAll('input[data-pw]'), function (input) {
    if (input.type === 'text') { input.type = 'password'; var b = input.parentNode.querySelector('.pw-toggle'); if (b) { b.innerHTML = EYE_OPEN; b.title = 'แสดงรหัสผ่าน'; b.setAttribute('aria-label', 'แสดงรหัสผ่าน'); } }
  });
}
function enhancePasswords(root) {
  Array.prototype.forEach.call((root || document).querySelectorAll('input[type="password"]:not([data-pw])'), function (input) {
    input.setAttribute('data-pw', '1');
    var wrap = document.createElement('span');
    wrap.className = 'pw-wrap';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pw-toggle';
    btn.setAttribute('aria-label', 'แสดงรหัสผ่าน');
    btn.title = 'แสดงรหัสผ่าน';
    btn.innerHTML = EYE_OPEN;
    btn.addEventListener('click', function () {
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.innerHTML = show ? EYE_OFF : EYE_OPEN;
      btn.setAttribute('aria-label', show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน');
      btn.title = show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน';
      input.focus();
    });
    wrap.appendChild(btn);
  });
}
enhancePasswords(document);
new MutationObserver(function (list) {
  for (var i = 0; i < list.length; i++) if (list[i].addedNodes.length) { enhancePasswords(document); return; }
}).observe(document.body, { childList: true, subtree: true });

/* ---------- Start ---------- */
computeDeviceHash().then(function (h) { S.deviceHash = h; });
serverCall('getPublicInfo', []).then(function (res) { S.publicInfo = res.data; renderPublicSchedule(); }).catch(function () { /* หน้าเข้าสู่ระบบยังใช้งานได้ */ });
if (google.script.url && google.script.url.getLocation) {
  google.script.url.getLocation(function (loc) {
    var code = loc && loc.parameter && loc.parameter.checkin ? String(loc.parameter.checkin).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6) : '';
    if (code && !S.token) { S.startCode = code; showPublicCheckin(code); }
  });
}
el('login-username').focus();
</script>
